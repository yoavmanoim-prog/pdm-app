apiVersion: v1
kind: Service
metadata:
  name: pdm-backend
  labels:
    app: pdm-backend
spec:
  type: {{ .Values.service.type }}
  selector:
    app: pdm-backend
  ports:
    # named port — the ServiceMonitor scrapes by name (port: http); without the
    # name Prometheus matches nothing and the backend silently stops being scraped
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
