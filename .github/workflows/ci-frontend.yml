# CI (frontend) — runs on pull requests that touch frontend code: install +
# production build. There are no frontend unit tests; the vite build catches
# broken imports, syntax errors and bad JSX before merge. Backend PRs are
# checked by ci-backend.yml.
name: CI Frontend

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
