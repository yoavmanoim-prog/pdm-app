# CI — runs on every pull request: lint + tests, nothing else.
# Fast feedback with no AWS access. Deploys live in deploy-staging.yml
# (develop) and deploy-production.yml (v* tags).
name: CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # cache pip downloads — skips re-downloading packages that haven't changed
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: flake8 app/

      - name: Test
        run: pytest tests/ -v
        env:
          DATABASE_URL: "postgresql://test:test@localhost/test"
          S3_BUCKET: "test-bucket"
